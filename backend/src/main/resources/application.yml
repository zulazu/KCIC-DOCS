server:
  port: ${KCIC_SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: KCIC_SESSION
        http-only: true
        same-site: lax
        secure: ${KCIC_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: kcic-docs
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${KCIC_DB_URL:jdbc:postgresql://localhost:5433/kcic_connect}
    username: ${KCIC_DB_USERNAME:kcic}
    password: ${KCIC_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${KCIC_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

kcic:
  app:
    name: KCIC Docs
    version: 1.0.0
    base-url: ${KCIC_APP_BASE_URL:http://localhost:5173}
    request-id-header: X-Request-Id
  security:
    cookie-secure: ${KCIC_COOKIE_SECURE:false}
    password-min-length: ${KCIC_PASSWORD_MIN_LENGTH:12}
    login-max-failures: ${KCIC_LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${KCIC_LOGIN_LOCK_MINUTES:15}
    bootstrap:
      username: ${KCIC_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${KCIC_BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${KCIC_BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${KCIC_BOOTSTRAP_ADMIN_DISPLAY_NAME:KCIC Administrator}
      employee-nip: ${KCIC_BOOTSTRAP_ADMIN_EMPLOYEE_NIP:}
  storage:
    provider: ${KCIC_STORAGE_PROVIDER:minio}
    endpoint: ${KCIC_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${KCIC_STORAGE_ACCESS_KEY:}
    secret-key: ${KCIC_STORAGE_SECRET_KEY:}
    bucket: ${KCIC_STORAGE_BUCKET:kcic-connect-documents}
    region: ${KCIC_STORAGE_REGION:us-east-1}
    local-root: ${KCIC_STORAGE_LOCAL_ROOT:}
  files:
    default-max-size-bytes: ${KCIC_FILE_MAX_SIZE:26214400}
